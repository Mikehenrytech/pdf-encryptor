name: Build .deb and Publish APT repo (GitHub Pages)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deb-and-publish-apt:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system deps (PySide6 runtime libs for build + APT tooling)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            dpkg-dev gzip \
            libxkbcommon-x11-0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-util1 \
            libxcb-xkb1 \
            libxcb-cursor0

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build binary (PyInstaller)
        run: |
          # Ajusta si tu spec/nombre difiere. Si usas spec en Linux, usa el spec.
          pyinstaller --noconfirm --clean --name pdf-cypher src/main.py

      - name: Build .deb
        run: |
          set -eux

          # Tag -> versión semver sin "v"
          VERSION="${GITHUB_REF_NAME#v}"

          # Rutas
          PKGROOT="pkgroot"
          APPNAME="pdf-cypher"
          BIN_SRC="dist/${APPNAME}"
          BIN_DST="${PKGROOT}/usr/bin/${APPNAME}"

          # Validación
          test -f "${BIN_SRC}"

          # Estructura de paquete
          rm -rf "${PKGROOT}"
          mkdir -p "${PKGROOT}/DEBIAN"
          mkdir -p "${PKGROOT}/usr/bin"
          mkdir -p "${PKGROOT}/usr/share/applications"
          mkdir -p "${PKGROOT}/usr/share/icons/hicolor/256x256/apps"

          # Binario
          install -m 0755 "${BIN_SRC}" "${BIN_DST}"

          # Desktop entry (ajusta rutas/nombre si difieren)
          install -m 0644 packaging/linux/PDF_Cypher.desktop \
            "${PKGROOT}/usr/share/applications/${APPNAME}.desktop"

          # Icono
          install -m 0644 packaging/linux/pdf_cypher.png \
            "${PKGROOT}/usr/share/icons/hicolor/256x256/apps/${APPNAME}.png"

          # Control file
          cat > "${PKGROOT}/DEBIAN/control" <<EOF
Package: ${APPNAME}
Version: ${VERSION}
Section: utils
Priority: optional
Architecture: amd64
Maintainer: Mikehenrytech <noreply@github.com>
Description: PDF Cypher - Encrypt PDFs in batch (GUI)
 Depends: libc6 (>= 2.35)
EOF

          # (Opcional) postinst para update-desktop-database / icon-cache
          cat > "${PKGROOT}/DEBIAN/postinst" <<'EOF'
#!/bin/sh
set -e
if command -v update-desktop-database >/dev/null 2>&1; then
  update-desktop-database -q || true
fi
if command -v gtk-update-icon-cache >/dev/null 2>&1; then
  gtk-update-icon-cache -q /usr/share/icons/hicolor || true
fi
exit 0
EOF
          chmod 0755 "${PKGROOT}/DEBIAN/postinst"

          # Construye el .deb
          DEB_NAME="${APPNAME}_${VERSION}_amd64.deb"
          dpkg-deb --build "${PKGROOT}" "${DEB_NAME}"

          mkdir -p release
          mv "${DEB_NAME}" release/

      - name: Upload artifact (Actions)
        uses: actions/upload-artifact@v4
        with:
          name: deb-amd64
          path: release/*.deb

      # --- Publicación a GitHub Pages (rama gh-pages) ---
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Publish APT repo into gh-pages
        run: |
          set -eux

          APPNAME="pdf-cypher"
          VERSION="${GITHUB_REF_NAME#v}"
          DEB="release/${APPNAME}_${VERSION}_amd64.deb"

          test -f "${DEB}"
          cd gh-pages

          # Layout del repo APT
          mkdir -p apt/pool
          mkdir -p apt/dists/stable/main/binary-amd64

          # Copia .deb al pool (no borramos versiones previas)
          cp -f "../${DEB}" "apt/pool/"

          # Genera Packages y Packages.gz
          cd apt
          dpkg-scanpackages --multiversion pool /dev/null > dists/stable/main/binary-amd64/Packages
          gzip -fk dists/stable/main/binary-amd64/Packages

          # Genera Release (sin firma, “insecure repo”)
          cat > dists/stable/Release <<EOF
Origin: Mikehenrytech
Label: PDF Cypher APT Repo
Suite: stable
Codename: stable
Architectures: amd64
Components: main
Description: APT repository for PDF Cypher
EOF

          # Añade hashes al Release
          (cd dists/stable && \
            echo "MD5Sum:" && \
            find main -type f ! -name Release -printf "%P\n" | while read -r f; do \
              printf " %s %16d %s\n" "$(md5sum "$f" | cut -d' ' -f1)" "$(stat -c%s "$f")" "$f"; \
            done && \
            echo "SHA256:" && \
            find main -type f ! -name Release -printf "%P\n" | while read -r f; do \
              printf " %s %16d %s\n" "$(sha256sum "$f" | cut -d' ' -f1)" "$(stat -c%s "$f")" "$f"; \
            done \
          ) >> dists/stable/Release

      - name: Commit and push gh-pages
        run: |
          set -eux
          cd gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add apt
          git commit -m "apt: publish ${GITHUB_REF_NAME}" || echo "No changes to commit"
          git push
