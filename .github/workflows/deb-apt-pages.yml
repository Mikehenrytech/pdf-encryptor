name: Build .deb and Publish APT repo (GitHub Pages)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deb-and-publish-apt:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system deps (PySide6 runtime libs for build + APT tooling)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            dpkg-dev gzip \
            libxkbcommon-x11-0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-util1 \
            libxcb-xkb1 \
            libxcb-cursor0

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build binary (PyInstaller)
        run: |
          # Ajusta si tu nombre real difiere
          pyinstaller --noconfirm --clean --name pdf-cypher src/main.py

      - name: Build .deb
        run: |
          set -eux

          VERSION="${GITHUB_REF_NAME#v}"

          PKGROOT="pkgroot"
          APPNAME="pdf-cypher"
          BIN_SRC="dist/${APPNAME}"
          BIN_DST="${PKGROOT}/usr/bin/${APPNAME}"

          test -f "${BIN_SRC}"

          rm -rf "${PKGROOT}"
          mkdir -p "${PKGROOT}/DEBIAN"
          mkdir -p "${PKGROOT}/usr/bin"
          mkdir -p "${PKGROOT}/usr/share/applications"
          mkdir -p "${PKGROOT}/usr/share/icons/hicolor/256x256/apps"

          install -m 0755 "${BIN_SRC}" "${BIN_DST}"

          install -m 0644 packaging/linux/PDF_Cypher.desktop \
            "${PKGROOT}/usr/share/applications/${APPNAME}.desktop"

          install -m 0644 packaging/linux/pdf_cypher.png \
            "${PKGROOT}/usr/share/icons/hicolor/256x256/apps/${APPNAME}.png"

          cat > "${PKGROOT}/DEBIAN/control" <<EOF
Package: ${APPNAME}
Version: ${VERSION}
Section: utils
Priority: optional
Architecture: amd64
Maintainer: Mikehenrytech <noreply@github.com>
Depends: libc6 (>= 2.35)
Description: PDF Cypher - Encrypt PDFs in batch (GUI)
EOF

          cat > "${PKGROOT}/DEBIAN/postinst" <<'EOF'
#!/bin/sh
set -e
if command -v update-desktop-database >/dev/null 2>&1; then
  update-desktop-database -q || true
fi
if command -v gtk-update-icon-cache >/dev/null 2>&1; then
  gtk-update-icon-cache -q /usr/share/icons/hicolor || true
fi
exit 0
EOF
          chmod 0755 "${PKGROOT}/DEBIAN/postinst"

          DEB_NAME="${APPNAME}_${VERSION}_amd64.deb"
          dpkg-deb --build "${PKGROOT}" "${DEB_NAME}"

          mkdir -p release
          mv "${DEB_NAME}" release/

      - name: Upload artifact (Actions)
        uses: actions/upload-artifact@v4
        with:
          name: deb-amd64
          path: release/*.deb

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Publish APT repo into gh-pages
        run: |
          set -eux

          APPNAME="pdf-cypher"
          VERSION="${GITHUB_REF_NAME#v}"
          DEB="../release/${APPNAME}_${VERSION}_amd64.deb"

          test -f "${DEB}"

          cd gh-pages

          mkdir -p apt/pool
          mkdir -p apt/dists/stable/main/binary-amd64

          cp -f "${DEB}" "apt/pool/"

          cd apt

          dpkg-scanpackages --multiversion pool /dev/null > dists/stable/main/binary-amd64/Packages
          gzip -fk dists/stable/main/binary-amd64/Packages

          cat > dists/stable/Release <<EOF
Origin: Mikehenrytech
Label: PDF Cypher APT Repo
Suite: stable
Codename: stable
Architectures: amd64
Components: main
Description: APT repository for PDF Cypher
EOF

          # Script para añadir hashes al Release (evita YAML frágil)
          cat > /tmp/gen_release_hashes.sh <<'EOS'
#!/usr/bin/env bash
set -euo pipefail

cd "dists/stable"

{
  echo "MD5Sum:"
  while IFS= read -r -d '' f; do
    rel="${f#./}"
    size="$(stat -c%s "$rel")"
    sum="$(md5sum "$rel" | awk '{print $1}')"
    printf " %s %16d %s\n" "$sum" "$size" "$rel"
  done < <(find . -type f ! -name Release -print0)

  echo "SHA256:"
  while IFS= read -r -d '' f; do
    rel="${f#./}"
    size="$(stat -c%s "$rel")"
    sum="$(sha256sum "$rel" | awk '{print $1}')"
    printf " %s %16d %s\n" "$sum" "$size" "$rel"
  done < <(find . -type f ! -name Release -print0)
} >> Release
EOS

          chmod +x /tmp/gen_release_hashes.sh
          /tmp/gen_release_hashes.sh

      - name: Commit and push gh-pages
        run: |
          set -eux
          cd gh-pages

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add apt
          git commit -m "apt: publish ${GITHUB_REF_NAME}" || echo "No changes to commit"
          git push
