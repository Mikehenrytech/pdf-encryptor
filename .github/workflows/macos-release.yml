  macos:
    name: Build macOS (.app) and Release
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build (.app) with PyInstaller
        run: |
          pyinstaller --noconfirm --clean --windowed \
            --name PDF_Cypher \
            --add-data "i18n:i18n" \
            src/main.py

      - name: Locate .app and package into zip
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p release

          # PyInstaller can output either:
          # - dist/PDF_Cypher.app
          # - dist/PDF_Cypher/PDF_Cypher.app
          if [[ -d "dist/PDF_Cypher.app" ]]; then
            APP_PATH="dist/PDF_Cypher.app"
          elif [[ -d "dist/PDF_Cypher/PDF_Cypher.app" ]]; then
            APP_PATH="dist/PDF_Cypher/PDF_Cypher.app"
          else
            echo "ERROR: Could not find PDF_Cypher.app under dist/"
            ls -la dist || true
            find dist -maxdepth 3 -type d -name "*.app" -print || true
            exit 1
          fi

          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "release/PDF_Cypher-macos.app.zip"
          ls -lh release

      - name: Upload artifact (Actions)
        uses: actions/upload-artifact@v4
        with:
          name: PDF_Cypher-macos
          path: release/PDF_Cypher-macos.app.zip

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/PDF_Cypher-macos.app.zip
