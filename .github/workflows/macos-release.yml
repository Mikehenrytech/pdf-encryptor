  macos:
    name: Build macOS (.app) and Release
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build (.app) with PyInstaller
        run: |
          pyinstaller --noconfirm --clean --windowed \
            --name PDF_Cypher \
            --add-data "i18n:i18n" \
            src/main.py

      - name: Package (.app) into zip
        run: |
          set -eux
          mkdir -p release
          ditto -c -k --sequesterRsrc --keepParent "dist/PDF_Cypher.app" "release/PDF_Cypher-macos.app.zip"
          ls -lh release

      - name: Upload artifact (Actions)
        uses: actions/upload-artifact@v4
        with:
          name: PDF_Cypher-macos
          path: release/PDF_Cypher-macos.app.zip

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/PDF_Cypher-macos.app.zip
