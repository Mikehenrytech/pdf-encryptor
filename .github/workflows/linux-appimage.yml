name: Build Linux AppImage and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            patchelf \
            fuse \
            libgl1 \
            libxkbcommon-x11-0

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # Recomendación para AppImage: onedir (AppDir)
      - name: Build (PyInstaller onedir)
        run: |
          pyinstaller --noconfirm --clean --onedir PDF_Cypher.spec

      - name: Prepare AppDir
        run: |
          set -eux
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps

          # Binarios (desde onedir)
          cp -r dist/PDF_Cypher/* AppDir/usr/bin/

          # Desktop + icon
          cp packaging/linux/PDF_Cypher.desktop AppDir/usr/share/applications/
          cp packaging/linux/pdf_cypher.png AppDir/usr/share/icons/hicolor/256x256/apps/pdf_cypher.png

          # AppRun (simple)
          cat > AppDir/AppRun << 'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/PDF_Cypher" "$@"
          EOF
          chmod +x AppDir/AppRun

      - name: Download linuxdeploy + plugin-qt
        run: |
          set -eux
          curl -L -o linuxdeploy-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -L -o linuxdeploy-plugin-qt-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage

      - name: Build AppImage
        env:
          LINUXDEPLOY_PLUGINS: qt
        run: |
          set -eux
          export QML_SOURCES_PATHS=""
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --plugin qt \
            --output appimage

          ls -la ./*.AppImage

      - name: Package
        run: |
          set -eux
          mkdir -p release
          APPIMAGE_FILE="$(ls -1 *.AppImage | head -n 1)"
          mv "$APPIMAGE_FILE" "release/PDF_Cypher-linux-x64.AppImage"

      - name: Upload artifact (Actions)
        uses: actions/upload-artifact@v4
        with:
          name: PDF_Cypher-linux-appimage
          path: release/PDF_Cypher-linux-x64.AppImage

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/PDF_Cypher-linux-x64.AppImage
